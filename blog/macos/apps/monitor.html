<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../css/app-common.css">
<style>
  .monitor-layout { display: flex; flex-direction: column; height: 100%; }
  .monitor-tabs { display: flex; border-bottom: 0.5px solid var(--app-border); flex-shrink: 0; }
  .monitor-tab {
    padding: 8px 16px; cursor: default; font-size: 11px; font-weight: 500;
    color: var(--app-text-secondary); border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .monitor-tab:hover { color: var(--app-text); }
  .monitor-tab.active { color: var(--app-text); border-bottom-color: var(--app-accent); }
  .monitor-content { flex: 1; overflow-y: auto; padding: 16px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .stat-card {
    background: rgba(255,255,255,0.04); border: 0.5px solid var(--app-border);
    border-radius: 8px; padding: 12px;
  }
  .stat-card .stat-label { font-size: 10px; color: var(--app-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .stat-value { font-size: 22px; font-weight: 300; margin-top: 4px; }
  .stat-card .stat-sub { font-size: 10px; color: var(--app-text-secondary); margin-top: 2px; }
  .progress-bar {
    height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08);
    margin-top: 8px; overflow: hidden;
  }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 1s; }
  .progress-fill.cpu { background: #0a84ff; }
  .progress-fill.mem { background: #30d158; }
  .progress-fill.gpu { background: #bf5af2; }
  .process-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .process-table th { text-align: left; padding: 6px 8px; color: var(--app-text-secondary); font-weight: 500; border-bottom: 1px solid var(--app-border); }
  .process-table td { padding: 5px 8px; border-bottom: 0.5px solid rgba(255,255,255,0.04); }
  .process-table tr:hover td { background: rgba(255,255,255,0.04); }
  canvas { border-radius: 6px; }
</style>
</head>
<body>
<div class="monitor-layout">
  <div class="monitor-tabs">
    <div class="monitor-tab active" data-tab="overview">Overview</div>
    <div class="monitor-tab" data-tab="cpu">CPU</div>
    <div class="monitor-tab" data-tab="memory">Memory</div>
    <div class="monitor-tab" data-tab="processes">Processes</div>
  </div>
  <div class="monitor-content" id="monitor-content"></div>
</div>

<script>
let currentTab = 'overview';
const contentEl = document.getElementById('monitor-content');
let cpuHistory = Array(30).fill(20);
let animFrame;

function randomCPU() { return Math.floor(Math.random() * 40 + 5); }
function randomMem() { return (Math.random() * 4 + 5).toFixed(1); }
function randomTemp() { return (Math.random() * 20 + 35).toFixed(1); }
function randomFan() { return Math.floor(Math.random() * 800 + 1500); }

function renderOverview() {
  const cpu = randomCPU();
  const memUsed = randomMem();
  const temp = randomTemp();
  contentEl.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">CPU Load</div>
        <div class="stat-value">${cpu}%</div>
        <div class="stat-sub">User: ${Math.floor(cpu*0.7)}% System: ${Math.floor(cpu*0.3)}%</div>
        <div class="progress-bar"><div class="progress-fill cpu" style="width:${cpu}%"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Memory Used</div>
        <div class="stat-value">${memUsed} GB</div>
        <div class="stat-sub">of 16 GB total</div>
        <div class="progress-bar"><div class="progress-fill mem" style="width:${memUsed/16*100}%"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">GPU</div>
        <div class="stat-value">${Math.floor(Math.random()*30+5)}%</div>
        <div class="stat-sub">Apple M5 Pro 18-core</div>
        <div class="progress-bar"><div class="progress-fill gpu" style="width:${30}%"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Temperature</div>
        <div class="stat-value">${temp}°C</div>
        <div class="stat-sub">Fan: ${randomFan()} RPM</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Network</div>
        <div class="stat-value">↓ ${(Math.random()*5).toFixed(1)} MB/s</div>
        <div class="stat-sub">↑ ${(Math.random()*2).toFixed(1)} MB/s</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Disk I/O</div>
        <div class="stat-value">${(Math.random()*50).toFixed(1)} MB/s</div>
        <div class="stat-sub">Read: ${(Math.random()*30).toFixed(1)} Write: ${(Math.random()*20).toFixed(1)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Uptime</div>
        <div class="stat-value">${Math.floor(Math.random()*48+4)}h ${Math.floor(Math.random()*60)}m</div>
        <div class="stat-sub">since last restart</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Processes</div>
        <div class="stat-value">${Math.floor(Math.random()*100+250)}</div>
        <div class="stat-sub">Threads: ${Math.floor(Math.random()*500+1000)}</div>
      </div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;">
      <canvas id="cpu-chart" width="440" height="120" style="flex:1;"></canvas>
      <canvas id="mem-chart" width="440" height="120" style="flex:1;"></canvas>
    </div>
  `;
  drawChart('cpu-chart', 'CPU Usage', cpuHistory, '#0a84ff');
  drawChart('mem-chart', 'Memory Pressure', cpuHistory.map(v => v * 0.7 + 10), '#30d158');
}

function drawChart(canvasId, label, data, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 5; i++) {
    const y = 15 + (H - 25) * i / 4;
    ctx.beginPath(); ctx.moveTo(35, y); ctx.lineTo(W - 10, y); ctx.stroke();
  }

  // Labels
  ctx.fillStyle = '#888'; ctx.font = '9px -apple-system, sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i < 5; i++) {
    const y = 15 + (H - 25) * i / 4;
    ctx.fillText((100 - i * 25) + '%', 32, y + 3);
  }
  ctx.fillStyle = '#aaa'; ctx.font = '10px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(label, 35, 12);

  // Line
  const stepX = (W - 50) / (data.length - 1);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = 40 + i * stepX;
    const y = H - 15 - (v / 100) * (H - 30);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Fill
  ctx.lineTo(40 + (data.length - 1) * stepX, H - 15);
  ctx.lineTo(40, H - 15);
  ctx.closePath();
  ctx.fillStyle = color.replace(')', ',0.15)').replace('rgb', 'rgba');
  ctx.fill();
}

function renderCPU() {
  contentEl.innerHTML = `
    <div class="stat-grid" style="margin-bottom:16px;">
      <div class="stat-card">
        <div class="stat-label">System</div><div class="stat-value">${Math.floor(Math.random()*10+2)}%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">User</div><div class="stat-value">${Math.floor(Math.random()*25+5)}%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Idle</div><div class="stat-value">${Math.floor(Math.random()*20+65)}%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Nice</div><div class="stat-value">${Math.floor(Math.random()*5)}%</div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--app-text-secondary);margin-bottom:8px;">Processor: Apple M5 Pro</div>
    <div style="font-size:11px;color:var(--app-text-secondary);">Cores: 12 (8 performance + 4 efficiency)</div>
    <div style="font-size:11px;color:var(--app-text-secondary);">Threads per core: 1</div>
    <div style="font-size:11px;color:var(--app-text-secondary);">Frequency: 4.05 GHz max</div>
    <div style="font-size:11px;color:var(--app-text-secondary);">L2 Cache: 36 MB (shared)</div>
    <canvas id="cpu-detail-chart" width="580" height="200" style="margin-top:16px;"></canvas>
  `;
  drawChart('cpu-detail-chart', 'CPU History', cpuHistory, '#0a84ff');
}

function renderMemory() {
  const used = (Math.random() * 4 + 6).toFixed(1);
  const cached = (Math.random() * 3 + 1).toFixed(1);
  const free = (16 - used - cached).toFixed(1);
  contentEl.innerHTML = `
    <div class="stat-grid" style="margin-bottom:16px;">
      <div class="stat-card">
        <div class="stat-label">Memory Used</div><div class="stat-value">${used} GB</div>
        <div class="progress-bar"><div class="progress-fill mem" style="width:${used/16*100}%"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cached Files</div><div class="stat-value">${cached} GB</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${cached/16*100}%;background:#ff9f0a;"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Free</div><div class="stat-value">${free} GB</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${free/16*100}%;background:#444;"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Swap Used</div><div class="stat-value">${(Math.random()*0.5).toFixed(1)} GB</div>
        <div class="stat-sub">of 4 GB</div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--app-text-secondary);">Type: LPDDR5X</div>
    <div style="font-size:11px;color:var(--app-text-secondary);">Speed: 7500 MT/s</div>
    <canvas id="mem-detail-chart" width="580" height="200" style="margin-top:16px;"></canvas>
  `;
  drawChart('mem-detail-chart', 'Memory Pressure', cpuHistory.map(v => v * 0.6 + 15), '#30d158');
}

function renderProcesses() {
  const kernel = window.parent.kernel;
  const proc = kernel ? kernel.get('proc') : null;
  let procs;
  if (proc) {
    procs = proc.list();
  } else {
    // Fallback static data
    procs = [
      { name:'kernel_task', cpu:'5.1', mem:'1.2 GB', pid:0, user:'root' },
      { name:'WindowServer', cpu:'8.2', mem:'420 MB', pid:187, user:'starwink' },
      { name:'Terminal', cpu:'2.3', mem:'156 MB', pid:421, user:'starwink' },
    ];
  }
  let html = `<table class="process-table">
    <tr><th>PID</th><th>Process Name</th><th>% CPU</th><th>Memory</th><th>User</th></tr>`;
  procs.forEach(p => {
    const memStr = typeof p.mem === 'number' ? p.mem + ' MB' : p.mem;
    html += `<tr><td>${p.pid}</td><td>${p.name}</td><td>${p.cpu}%</td><td>${memStr}</td><td>${p.user || 'starwink'}</td></tr>`;
  });
  html += '</table>';
  html += `<div style="font-size:10px;color:var(--app-text-secondary);margin-top:8px;">${procs.length} total processes.</div>`;
  contentEl.innerHTML = html;
}

function updateData() {
  cpuHistory.push(randomCPU());
  if (cpuHistory.length > 30) cpuHistory.shift();

  switch (currentTab) {
    case 'overview': renderOverview(); break;
    case 'cpu': renderCPU(); break;
    case 'memory': renderMemory(); break;
    case 'processes': renderProcesses(); break;
  }
  animFrame = requestAnimationFrame(() => setTimeout(updateData, 1500));
}

// Tab switching
document.querySelectorAll('.monitor-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.monitor-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    updateData();
  });
});

// Init
renderOverview();
animFrame = requestAnimationFrame(() => setTimeout(updateData, 1500));

window.parent.postMessage({ type: 'set-title', title: 'System Monitor' }, '*');
</script>
</body>
</html>
